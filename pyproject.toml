[project]
name = "dashboard-sla-helpdesk"
version = "0.1.0"
description = "Dashboard de SLA para helpdesk de suporte TI (fila, SLA por severidade, relatorio de desempenho)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard_sla_helpdesk"]
