<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Helpdesk SLA{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f5f7fa; color: #1f2937; line-height: 1.5; }
        header { background: #111827; color: #fff; padding: 1rem 1.5rem; }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        nav a { color: #93c5fd; text-decoration: none; margin-right: 1.5rem; font-size: 0.95rem; }
        nav a:hover { color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .kpi-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1.25rem; box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
        .kpi-card h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; margin-bottom: 0.5rem; }
        .kpi-card .value { font-size: 2rem; font-weight: 700; color: #111827; }
        .kpi-card .value.sla { color: #059669; }
        .kpi-card .value.danger { color: #dc2626; }
        .kpi-card .value.warn { color: #d97706; }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; }
        th { background: #f9fafb; font-weight: 600; color: #374151; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 0.05em; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background: #f9fafb; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-critical { background: #fecaca; color: #991b1b; }
        .badge-high { background: #fed7aa; color: #9c4221; }
        .badge-medium { background: #fef3c7; color: #92400e; }
        .badge-low { background: #d1fae5; color: #065f46; }
        .badge-open { background: #dbeafe; color: #1e40af; }
        .badge-in_progress { background: #e0e7ff; color: #3730a3; }
        .badge-resolved { background: #dcfce7; color: #166534; }
        .badge-closed { background: #f3f4f6; color: #374151; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.35rem; font-weight: 600; font-size: 0.9rem; color: #374151; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; background: #fff; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        button { background: #111827; color: #fff; border: none; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
        button:hover { background: #1f2937; }
        button.secondary { background: #e5e7eb; color: #111827; }
        button.secondary:hover { background: #d1d5db; }
        .actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
        .filters { display: flex; gap: 0.75rem; align-items: end; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .filters select, .filters input { padding: 0.45rem 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9rem; }
        .empty { text-align: center; padding: 3rem; color: #6b7280; }
        .error { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; }
        .sla-meta { font-size: 0.8rem; color: #6b7280; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <header>
        <h1>Helpdesk SLA — Suporte TI</h1>
        <nav>
            <a href="{{ url_for('helpdesk.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('helpdesk.tickets_list') }}">Fila de tickets</a>
            <a href="{{ url_for('helpdesk.new_ticket') }}">Novo ticket</a>
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
