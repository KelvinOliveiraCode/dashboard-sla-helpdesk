{% extends "base.html" %}

{% block title %}Novo ticket{% endblock %}

{% block content %}
<h2 style="margin-bottom: 1rem;">Novo ticket</h2>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="post" action="{{ url_for('helpdesk.new_ticket') }}">
    <div class="form-group">
        <label for="title">Titulo</label>
        <input type="text" id="title" name="title" required maxlength="200" placeholder="Ex: Servidor fora do ar">
    </div>
    <div class="form-group">
        <label for="description">Descricao</label>
        <textarea id="description" name="description" placeholder="Detalhes do chamado"></textarea>
    </div>
    <div class="form-group">
        <label for="severity">Severidade</label>
        <select id="severity" name="severity">
            <option value="critical">Critico (SLA 4h)</option>
            <option value="high">Alta (SLA 8h)</option>
            <option value="medium" selected>Media (SLA 24h)</option>
            <option value="low">Baixa (SLA 72h)</option>
        </select>
        <div class="sla-meta">O prazo de SLA e definido automaticamente pela severidade.</div>
    </div>
    <div class="actions">
        <button type="submit">Criar ticket</button>
        <a href="{{ url_for('helpdesk.tickets_list') }}" class="button secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
